<script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!window.claude)window.claude={use:async()=>({save:async({filename:f,data:d})=>{const u=URL.createObjectURL(d instanceof Blob?d:new Blob([d])),a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}})};
const CATS={"Headphones":"🎧","Phone Covers":"📱","Chargers":"🔌"};
const DEF=()=>({"Headphones":["boAt","Mivi","OnePlus"],"Phone Covers":["Spigen","Ringke"],"Chargers":["Mi","Samsung","Realme"]});
let D={items:[],customers:[],bill:1000,brands:DEF()};
try{const x=JSON.parse(localStorage.getItem("shopdata"));if(x){D=x;D.brands=D.brands||DEF();D.customers=D.customers||[]}}catch(e){}
D.cats=D.cats||{...CATS};D.camps=D.camps||[];D.set=Object.assign({shop:"My Accessory Shop",addr:"",phone:"",low:3,tag:"",sub:"",jur:""},D.set||{});D.bills=D.bills||[];
const q=i=>i.qty==null?1:i.qty,qty=l=>l.reduce((a,i)=>a+q(i),0);
let _last=null,ready=false;
const snap=()=>{const t=D._ts;delete D._ts;const s=JSON.stringify(D);if(t!==undefined)D._ts=t;return s};
const save=()=>{try{if(ready){const s=snap();if(s!==_last){_last=s;D._ts=Date.now();window.cloudPush&&window.cloudPush()}}localStorage.setItem("shopdata",JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),fmt=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>fmt(new Date());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>s.replace(/['"\\<>&]/g,"").trim();
const stock=()=>D.items.filter(i=>i.status=="stock"),sold=()=>D.items.filter(i=>i.status=="sold"),byId=u=>D.items.find(i=>i.uid==u);
const sales=cid=>sold().filter(i=>i.sale.cid==cid),sum=l=>l.reduce((a,i)=>a+i.sale.price,0);
function cust(n,p,e){let c=D.customers.find(c=>c.phone==p);if(!c){c={id:"C"+Date.now()+Math.random().toString(36).slice(2,5),name:n,phone:p,email:e||"",since:today()};D.customers.push(c)}else if(e&&!c.email)c.email=e;return c}
sold().forEach(i=>{if(!i.sale.cid)i.sale.cid=cust(i.sale.buyer,i.sale.phone,i.sale.email).id});save();
let nav=[{p:"home"}],msg="",hist=0,SF=null,pre=null,SP={mode:"month",month:today().slice(0,7),year:today().slice(0,4)};
const cur=()=>nav[nav.length-1];
function toast(m,ok){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.style.background=ok?'#067d62':'#c40000';t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',3000)}
function push(o){if(o.p=="addform")PF={};if(o.p=="sellform"){SF={mode:pre?"old":"new",cid:pre};pre=null}nav.push(o);msg="";try{history.pushState(1,"");hist++}catch(e){}render()}
let skip=0,PF={},OF={};
function back(){if(hist>0){try{history.back();return}catch(e){}}nav.pop();msg="";render()}
function pop1(){nav.pop();msg="";if(hist>0){hist--;skip=1;try{history.back()}catch(e){skip=0}}}
window.addEventListener("popstate",()=>{if(skip){skip=0;return}hist=Math.max(0,hist-1);if(nav.length>1){nav.pop();msg="";render()}});
function home(){nav=[{p:"home"}];pre=null;render()}
const thumb=i=>i.img?`<img src="${i.img}">`:`<div class="ph"></div>`;
const row=(ic,t,s,r,o)=>`<div class="item" onclick="${o}">${ic.startsWith("<")?ic:`<div class="ic">${ic}</div>`}<div class="t"><b>${esc(t)}</b><span>${esc(s)}</span></div>${r?`<b>${r}</b>`:'<div class="go">›</div>'}</div>`;
function render(){
 const c=cur();
 if(c.p=="home"){$("#hd").innerHTML=`<div style="width:100%"><h1>🛒 ${esc(D.set.shop)}<small>${new Date().toDateString()}</small></h1><div class="sb"><input id="hq" placeholder="Search items or customers" oninput="hs()"><span>🔍</span></div></div>`}
 else{const k=c.p=="cust"?D.customers.find(x=>x.id==c.cid):null;
  const T={cats:[c.mode=="add"?"Add stock":"Sell item","Choose a category"],brands:[c.cat,"Choose a brand"],addform:["Add product","Fill details & save"],more:["Settings","Shop, stock & backup"],offers:["Festive Offers","WhatsApp offers"],sale:["Make bill","Items & customer"],bill2:["Bill",""],offerform:["New offer","Write your offer"],offersend:["Send offer","Review customers"],items:[c.brand,"Select item to sell"],sellform:["Create bill","Customer & price"],bill:["Bill","Saved"],sold:["Sales & Bills",sold().length+" bills"],custs:["Customers","Search buyers & history"],cust:["Customer",k?k.name:""],stock:[c.sell?"Sell":"Stock",c.sell?"Search & pick a product":qty(stock())+" items in stock"],sales:["View sales","Monthly & yearly reports"]}[c.p];
  $("#hd").innerHTML=`<button class="back" onclick="back()" aria-label="Back">←</button><h1>${esc(T[0])}<small>${esc(T[1])}</small></h1>`}
 $("#app").innerHTML=V[c.p](c);navBar(c);window.scrollTo(0,0);
}
const V={
home:()=>{const sl=sold().filter(i=>i.sale.date==today()),pb=D.bills.filter(b=>b.status=="draft"),old=!D.set.lastBackup||(Date.now()-new Date(D.set.lastBackup))>7*864e5;
 return `<div id="hres"></div><div id="hmain">${old&&D.items.length?`<div class="note" style="margin:0 0 10px" onclick="go('more')">💾 Please take a backup of your data. Tap here.</div>`:""}<div class="stats"><div class="st"><span>Today's sales</span><b>${money(sum(sl))}</b></div><div class="st"><span>Items in stock</span><b>${qty(stock())}</b></div></div><div class="stats"><button class="p" style="margin:0" onclick="go('sell')">+ New sale</button><button class="p g" style="margin:0" onclick="push({p:'addform',cat:'',brand:''})">+ Add product</button></div>

const icoFor=n=>{n=n.toLowerCase();const f=[["speaker","🔊"],["cable","🔗"],["watch","⌚"],["glass","🛡"],["power","🔋"],["earphone","🎵"],["head","🎧"],["charger","🔌"],["cover","📱"]].find(([k])=>n.includes(k));return f?f[1]:"📦"};
function ask(t,ph,cb,num){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:20px";o.innerHTML=`<div class="card" style="width:100%;max-width:360px;margin:0"><b>${t}</b><input id="mi" ${num?'type="number" inputmode="numeric"':""} placeholder="${ph}"><div style="display:flex;gap:8px"><button class="p g" id="mc">Cancel</button><button class="p" id="mo">Save</button></div></div>`;document.body.appendChild(o);$("#mc").onclick=()=>{o.remove();render()};$("#mo").onclick=()=>{const v=$("#mi").value.trim();if(!v)return;o.remove();cb(v)};$("#mi").focus()}
const cap=()=>{PF={};["n","u","qt","d","cp","sp"].forEach(k=>{const e=$("#"+k);if(e)PF[k=="qt"?"q":k]=e.value})};
function catChg(v){cap();if(v=="__new")return ask("Create New Category","Category name",n=>{n=clean(n);D.cats[n]=D.cats[n]||icoFor(n);D.brands[n]=D.brands[n]||[];save();cur().cat=n;cur().brand="";render();toast("Category created ✓",1)});cur().cat=v;cur().brand="";render()}
function brChg(v){cap();if(v=="__new")return ask("Create New Brand","Brand name",n=>{n=clean(n);const l=D.brands[cur().cat]=D.brands[cur().cat]||[];if(!l.some(b=>b.toLowerCase()==n.toLowerCase()))l.push(n);save();cur().brand=n;render();toast("Brand added ✓",1)});cur().brand=v;render()}
const newCat=()=>ask("Add New Category","Category name",n=>{n=clean(n);D.cats[n]=D.cats[n]||icoFor(n);D.brands[n]=D.brands[n]||[];save();render();toast("Category created ✓",1)});
const addStock=u=>ask("Quantity received","e.g. 10",v=>{const i=byId(u);i.qty=q(i)+(+v||0);save();render();toast("Stock updated ✓",1)},1);
function saveSet(){D.set.shop=clean($("#ss").value)||D.set.shop;D.set.phone=clean($("#sph").value);D.set.addr=cl2($("#sa").value);D.set.tag=cl2($("#stg").value);D.set.sub=cl2($("#ssb").value);D.set.jur=cl2($("#sj").value);if(+$("#snb").value-1>D.bill)D.bill=+$("#snb").value-1;D.set.low=+$("#sl").value||0;save();render();toast("Settings saved ✓",1)}
